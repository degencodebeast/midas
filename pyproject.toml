[project]
name = "magic-agent"
version = "0.1.0"
description = "Bounded autonomous ICT/SMC trading agent (BNB Track 1)"
readme = "README.md"
authors = [
    { name = "degencodebeast", email = "newfirereloaded@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "magic-scanner",
]

[project.scripts]
magic-agent = "magic_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
magic-scanner = { path = "../trading-scanner", editable = true }

[dependency-groups]
dev = [
    "pytest>=9.1.0",
]
