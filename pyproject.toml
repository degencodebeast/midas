[project]
name = "magic-agent"
version = "0.1.0"
description = "Bounded autonomous ICT/SMC trading agent (BNB Track 1)"
readme = "README.md"
authors = [
    { name = "degencodebeast", email = "newfirereloaded@proton.me" }
]
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.109.2",
    "fastapi>=0.137.1",
    "magic-scanner",
    "uvicorn>=0.49.0",
]

[project.scripts]
magic-agent = "magic_agent.cli:main"

[project.optional-dependencies]
# ERC-8004 on-chain identity is OPTIONAL and independent of the trading path.
# Without it, the dashboard shows "unregistered" (see cli._resolve_agent_id);
# identity does not gate the runtime (which is itself not yet launchable).
# Install with: `uv sync --extra identity` or `pip install 'magic-agent[identity]'`.
# Distribution/import package is `bnbagent` (https://github.com/bnb-chain/bnbagent-sdk).
# Pinned to an IMMUTABLE commit (not a floating branch/HEAD) so fresh installs are
# reproducible; bump the sha deliberately when you want a newer SDK.
identity = ["bnbagent @ git+https://github.com/bnb-chain/bnbagent-sdk@8a65004c4969bb1f16feaa4adf4f422ac870cf10"]

# Live market data via gate.io is OPTIONAL: GateioFrameSource imports `ccxt`
# LAZILY, so the module and the offline FixtureFrameSource path need no ccxt.
# Only the live (`GateioFrameSource`) path requires it. Read-only OHLCV only —
# no keys, no funds, no orders. Install with: `uv sync --extra live`.
live = ["ccxt>=4.0"]

[build-system]
requires = ["uv_build>=0.11.6,<0.12.0"]
build-backend = "uv_build"

[tool.uv.sources]
# Scanner pinned to an IMMUTABLE rev so the resolved source can't drift under you
# (a `branch =` ref floats to HEAD on every re-lock — a `rev =` sha does not).
# Deployable `git+https` pin: 5f92552 is on origin/build/scanner-contract. The repo is
# PRIVATE, so a clean VPS/CI `uv sync` needs a read-only GitHub token configured in git's
# credential helper / `url.insteadOf` — NEVER embed the token in this URL or commit it.
# Bump the sha deliberately to pick up scanner changes, then re-run `uv lock`. (Local
# editable dev: see the override note below — do NOT commit it. Deploy auth: runbook (d).)
magic-scanner = { git = "https://github.com/degencodebeast/trading-scanner", rev = "5f92552e8fdd688808e2709eefc176ab681b7f4f" }
# Local-dev override (editable sibling scanner): do NOT commit this uncommented.
# After `uv sync`, run `uv pip install -e ../trading-scanner` to point at the local
# checkout, or temporarily swap the source above to:
#   magic-scanner = { path = "../trading-scanner", editable = true }

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.0",
]
